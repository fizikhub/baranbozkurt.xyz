<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Yörüngeden çıktık — Baran Bozkurt</title>
    <link rel="icon" href="/assets/mark.svg" />
    <link rel="stylesheet" href="/assets/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        background: #f77732;
        color: #202320;
        display: grid;
        place-items: center;
        font-family: "Bricolage Grotesque", sans-serif;
        padding: 32px;
      }
      main {
        max-width: 600px;
      }
      h1 {
        font-size: clamp(3rem, 10vw, 6rem);
        line-height: 1;
        letter-spacing: -0.04em;
        margin: 24px 0;
      }
      p {
        font-size: 18px;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        color: inherit;
        padding: 15px 0;
        margin-top: 20px;
        text-underline-offset: 6px;
      }
      span {
        font-family: Caveat, cursive;
        font-size: 28px;
      }
      a:focus-visible {
        outline: 3px solid;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <span>404 · Küçük bir uzay-zaman sapması.</span>
      <h1>Yörüngeden<br />çıktık.</h1>
      <p>Bu sayfa burada değil. Belki başka bir paralel evrendedir.</p>
      <a href="/">Ana sayfaya dön ↗</a>
    </main>
  </body>
</html>
